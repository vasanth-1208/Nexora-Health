version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nexora-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexora_health
    volumes:
      - nexora_mongo_data:/data/db
    networks:
      - nexora-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/nexora_health
      JWT_SECRET: super_secret_production_key_nexora_health_2026
      FRONTEND_URL: http://localhost:80
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - nexora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nexora-net

volumes:
  nexora_mongo_data:

networks:
  nexora-net:
    driver: bridge
